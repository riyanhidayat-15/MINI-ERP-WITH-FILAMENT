services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: catering_saas_app
        restart: unless-stopped
        ports:
            - "8000:8080"
        environment:
            APP_ENV: local
            PORT: 8080
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - .:/app
            - /app/vendor
        depends_on:
            - mysql

    mysql:
        image: mysql:8.4
        container_name: mysql_dev
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: catering-secret-db
            MYSQL_DATABASE: catering_saas
        ports:
            - "3308:3306"
        volumes:
            - mysql_dev_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:5
        container_name: phpmyadmin-dev
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        ports:
            - "8080:80"
        depends_on:
            - mysql

volumes:
    mysql_dev_data:
